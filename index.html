<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <link rel="stylesheet" href="style.css" />

    <title>Frontend Mentor | Social links profile</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  </head>
  <body>
    <article class="card">
      <img
        src="./assets/images/avatar-jessica.jpeg"
        class="profile-pic"
        alt="profile picture"
      />

      <div class="name-location">
        <h1 class="title">Jessica Randall</h1>

        <p class="description">London, United Kingdom</p>
      </div>

      <p class="bio">"Front-end developer and avid reader."</p>

      <nav class="buttons">
        <a class="button">GitHub</a>
        <a class="button">Frontend Mentor</a>
        <a class="button">Linkedin</a>
        <a class="button">Twitter</a>
        <a class="button">Instagram</a>
      </nav>
    </article>
  </body>
</html>
